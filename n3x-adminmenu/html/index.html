<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N3X Admin Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminMenu" class="admin-menu hidden">
        <div class="menu-container">
            <!-- Header -->
            <div class="menu-header">
                <div class="menu-title">
                    <span class="drag-indicator">⋮⋮</span>
                    <span>ADMIN PANEL</span>
                </div>
                <div class="header-controls">
                    <button id="devModeToggle" class="dev-mode-btn" title="Toggle Dev Mode (F1-F6 Keybinds)">
                        <span id="devModeIcon">⚡</span>
                        <span id="devModeText">Dev</span>
                    </button>
                    <button id="closeBtn" class="close-btn">✕</button>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="all">All</button>
                <button class="tab-btn" data-tab="player">Player</button>
                <button class="tab-btn" data-tab="utility">Utility</button>
                <button class="tab-btn" data-tab="favorites">★</button>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search commands...">
            </div>

            <!-- Command List -->
            <div class="command-list" id="commandList">
                <!-- Commands will be populated here -->
            </div>

            <!-- Dev Mode Keybinds Info -->
            <div id="devModeInfo" class="dev-mode-info hidden">
                <div class="info-title">⚡ Dev Mode Active - Hold ALT + Key</div>
                <div class="keybind-list">
                    <div class="keybind-item"><span class="key">ALT+Z</span> NoClip</div>
                    <div class="keybind-item"><span class="key">ALT+X</span> God Mode</div>
                    <div class="keybind-item"><span class="key">ALT+C</span> Invisible</div>
                    <div class="keybind-item"><span class="key">ALT+V</span> Revive</div>
                    <div class="keybind-item"><span class="key">ALT+F</span> Fix Veh</div>
                    <div class="keybind-item"><span class="key">ALT+G</span> Heal</div>
                    <div class="keybind-item"><span class="key">ALT+H</span> Armor</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
