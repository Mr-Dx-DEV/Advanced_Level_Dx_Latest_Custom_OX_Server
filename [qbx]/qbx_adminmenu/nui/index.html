<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBX Admin Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="devModeHUD" class="dev-hud hidden">
        <div class="hud-header">
            <div class="hud-title">⚡ DEV MODE ACTIVE</div>
            <div class="hud-speed" id="noclipSpeed">Speed: 1.0x</div>
        </div>
        <div class="hud-keybinds">
            <div class="hud-key"><span>F1</span> NoClip</div>
            <div class="hud-key"><span>F2</span> God</div>
            <div class="hud-key"><span>F3</span> Invisible</div>
            <div class="hud-key"><span>F5</span> Revive</div>
            <div class="hud-key"><span>F6</span> Fix Vehicle</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
