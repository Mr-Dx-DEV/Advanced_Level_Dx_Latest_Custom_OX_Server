<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="index.css" />
		<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<div class="notify-area"></div>

		<div class="main-container">
			<div class="circle-3"></div>

			<div class="top-bar">
				<p class="clock">9:41</p>
				<p class="month">Mon Jun 6</p>
				<img src="public/modem.svg" class="modem" />
				<img src="public/wifi.svg" class="wifi" />
				<img src="public/battery-icon.svg" class="battery" />
				<p class="battery-text">100%</p>
			</div>

			<div class="left-menu">
				<div class="circle-1"></div>
				<div class="circle-2"></div>

				<img src="public/logo.png" class="noodle" />
				<p class="tworst">SAVANA</p>
				<p class="managment">Restaurant</p>
				<p class="menu-category-text">Categories</p>
				<div class="menu-buttons-container">
					<div onclick="selectCategory('all')" class="menu-button allCategory active">All</div>
				</div>
			</div>
			<div class="serach-item-box">
				<img src="public/search-icon.svg" class="serach-icon" />
				<input class="search-input" type="text" placeholder="Search Item..." />
			</div>
			<div class="user-name">Brenden Randall</div>
			<div class="user-cash">$56,000</div>
			<div class="foto-border">
				<img src="public/foto.svg" class="foto" />
			</div>
			<p class="product-list-text">Product List</p>
			<div class="burgers-item-container"></div>
			
			<div class="center">
				<div class="pop-up">
					<div class="top">
						<img class="pop-up-image" src="public/items/banana.png">

						<div class="input-box">
							<input class="input-value" value="1" min="1" type="number">
						</div>

						<p class="input-text">HAMBURGER</p>
					</div>

					<div class="item-list"></div>
					
					<div onclick="craft()" class="button">
						Craft
					</div>
				</div>
			</div>

		</div>
		<script src="main.js" defer></script>
	</body>
</html>
