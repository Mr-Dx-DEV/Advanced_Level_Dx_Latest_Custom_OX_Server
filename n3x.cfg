##############
### N3X UI ###
##############

# N3X UI Pack Configuration
# These convars customize the appearance and behavior of the N3X UI Pack

# Primary color for UI elements (hex color code)
# Default: #BEEE11 (lime green)
# You can change this to any color: #FF0000 (red), #00FF00 (green), #0000FF (blue), etc.
setr n3x:primaryColor "#BEEE11"

# Notification duration in milliseconds
# Default: 3000 (3 seconds)
# Higher values = notifications stay longer on screen
setr n3x:notificationDuration 3000

# Key to cancel progress bars
# Default: X
# Other options: E, ESC, SPACE, etc.
setr n3x:progressCancelKey "X"

# Target icon (Font Awesome icon class)
# Default: fas fa-share
# You can use any Font Awesome icon: fas fa-hand, fas fa-crosshairs, etc.
setr n3x:targetIcon "fas fa-share"

# Override ox_lib UI functions
# Default: 1 (enabled)
# When enabled, n3x_uipack will override ox_lib's notify, progressBar, etc.
# Set to 0 to disable and use n3x.* functions directly
setr n3x:overrideOxLib 1

# Debug mode
# Default: 0 (disabled)
# Set to 1 to enable debug messages in F8 console
setr n3x:debug 0

# Locale
# Default: en
# Available: en, de, pl
setr n3x:locale "en"
