<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N3X UI Pack</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Notification Container -->
    <div id="notification-container"></div>

    <!-- Progress Container -->
    <div id="progress-container" class="hidden">
        <div id="progress-bar-wrapper" class="progress-wrapper">
            <div class="progress-label"></div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="progress-percentage"></div>
        </div>

        <div id="progress-circle-wrapper" class="progress-wrapper">
            <div class="progress-circle">
                <svg viewBox="0 0 100 100">
                    <circle class="progress-circle-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-circle-fill" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="progress-circle-content">
                    <div class="progress-circle-icon">
                        <i class="fas fa-sync-alt fa-spin"></i>
                    </div>
                    <div class="progress-circle-label"></div>
                    <div class="progress-circle-percentage"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Dialog -->
    <div id="input-dialog" class="dialog-overlay hidden">
        <div class="dialog-container">
            <div class="dialog-header">
                <h2 class="dialog-title"></h2>
                <button class="dialog-close" onclick="closeInput()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="dialog-content">
                <form id="input-form"></form>
            </div>
            <div class="dialog-footer">
                <button class="btn btn-secondary" onclick="closeInput()">Cancel</button>
                <button class="btn btn-primary" onclick="submitInput()">Submit</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="dialog-overlay hidden">
        <div class="context-container">
            <div class="context-header">
                <h2 class="context-title"></h2>
                <button class="context-close" onclick="closeContext()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="context-search hidden">
                <input type="text" id="context-search-input" placeholder="Search...">
            </div>
            <div class="context-content">
                <div id="context-options"></div>
            </div>
        </div>
    </div>

    <!-- Skill Check -->
    <div id="skillcheck-container" class="hidden">
        <div id="skillcheck-circle" class="skillcheck-wrapper">
            <div class="skillcheck-info">
                <div class="skillcheck-attempts"></div>
                <div class="skillcheck-timer"></div>
            </div>
            <div class="skillcheck-circle-outer">
                <div class="skillcheck-circle-inner">
                    <div class="skillcheck-target"></div>
                    <div class="skillcheck-cursor"></div>
                </div>
            </div>
            <div class="skillcheck-instruction">Press <span class="key">SPACE</span> at the right time!</div>
        </div>

        <div id="skillcheck-bar" class="skillcheck-wrapper hidden">
            <div class="skillcheck-bar-container">
                <div class="skillcheck-bar-target"></div>
                <div class="skillcheck-bar-cursor"></div>
            </div>
            <div class="skillcheck-instruction">Press <span class="key">SPACE</span> at the right time!</div>
        </div>

        <div id="skillcheck-keys" class="skillcheck-wrapper hidden">
            <div class="skillcheck-keys-container">
                <div class="skillcheck-key-display"></div>
            </div>
            <div class="skillcheck-instruction">Press the displayed key!</div>
        </div>
    </div>

    <!-- Text UI -->
    <div id="textui-container" class="hidden">
        <div class="textui-content">
            <i class="textui-icon"></i>
            <span class="textui-text"></span>
        </div>
    </div>

    <!-- Alert Dialog -->
    <div id="alert-dialog" class="dialog-overlay hidden">
        <div class="alert-container">
            <div class="alert-header">
                <h2 class="alert-title"></h2>
            </div>
            <div class="alert-content">
                <p class="alert-text"></p>
            </div>
            <div class="alert-footer">
                <div id="alert-buttons"></div>
            </div>
        </div>
    </div>

    <!-- NPC Dialog -->
    <div id="npc-dialog" class="hidden">
        <div class="npc-container">
            <div class="npc-avatar hidden">
                <img src="" alt="NPC Avatar">
            </div>
            <div class="npc-content">
                <div class="npc-name"></div>
                <div class="npc-message"></div>
                <div class="npc-choices"></div>
            </div>
        </div>
    </div>

    <!-- Radial Menu -->
    <div id="radial-menu" class="dialog-overlay hidden">
        <div class="radial-container">
            <div id="radial-items"></div>
            <div class="radial-center">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
